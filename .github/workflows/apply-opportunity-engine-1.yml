name: Apply Opportunity Engine 1.0

on:
  workflow_dispatch:
  push:
    branches:
      - feature/opportunity-engine-1
    paths:
      - tools/apply_opportunity_engine_1.py
      - .github/workflows/apply-opportunity-engine-1.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/opportunity-engine-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Opportunity Engine patch
        run: python tools/apply_opportunity_engine_1.py
      - name: Validate Python syntax
        run: |
          python -m py_compile BrokerBeacon_AI_Phase2/app.py
          python -m py_compile BrokerBeacon_AI_Phase2/migrations.py
      - name: Validate generated feature markers
        run: |
          grep -q 'BUILD_VERSION = "12.3"' BrokerBeacon_AI_Phase2/app.py
          grep -q "@app.get('/api/opportunity-engine')" BrokerBeacon_AI_Phase2/app.py
          grep -q 'section id="opportunityengine"' BrokerBeacon_AI_Phase2/app.py
          grep -q 'data-v="opportunityengine"' BrokerBeacon_AI_Phase2/app.py
      - name: Commit generated application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add BrokerBeacon_AI_Phase2/app.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Implement Opportunity Engine 1.0"
            git push origin HEAD:feature/opportunity-engine-1
          fi
