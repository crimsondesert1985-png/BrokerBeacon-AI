name: Apply Broker DNA UI

on:
  push:
    branches:
      - feature/broker-dna
    paths:
      - tools/apply_broker_dna_ui.py
      - .github/workflows/apply-broker-dna-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/broker-dna
          fetch-depth: 0
      - name: Apply Broker DNA workspace
        run: python tools/apply_broker_dna_ui.py
      - name: Validate Python syntax
        run: python -m py_compile BrokerBeacon_AI_Phase2/app.py BrokerBeacon_AI_Phase2/migrations.py
      - name: Commit generated application update
        run: |
          if git diff --quiet -- BrokerBeacon_AI_Phase2/app.py; then
            echo "Broker DNA UI is already applied."
            exit 0
          fi
          git config user.name "BrokerBeacon Automation"
          git config user.email "actions@users.noreply.github.com"
          git add BrokerBeacon_AI_Phase2/app.py
          git commit -m "Implement visible Broker DNA workspace"
          git push origin HEAD:feature/broker-dna
