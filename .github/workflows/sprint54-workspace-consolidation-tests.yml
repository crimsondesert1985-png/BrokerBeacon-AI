name: Sprint 54 Workspace Consolidation Tests

on:
  pull_request:
    paths:
      - 'BrokerBeacon_AI_Phase2/workspace_consolidation.py'
      - 'BrokerBeacon_AI_Phase2/wsgi.py'
      - 'BrokerBeacon_AI_Phase2/test_workspace_consolidation.py'
      - '.github/workflows/sprint54-workspace-consolidation-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BrokerBeacon_AI_Phase2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask
      - run: python -m py_compile workspace_consolidation.py wsgi.py
      - run: python -m unittest -v test_workspace_consolidation.py
