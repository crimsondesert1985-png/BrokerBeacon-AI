name: Sprint 56 BeaconMatch Foundation Tests

on:
  pull_request:
    paths:
      - 'BrokerBeacon_AI_Phase2/beaconmatch_foundation.py'
      - 'BrokerBeacon_AI_Phase2/test_beaconmatch_foundation.py'
      - 'BrokerBeacon_AI_Phase2/wsgi.py'
      - '.github/workflows/sprint56-beaconmatch-foundation-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BrokerBeacon_AI_Phase2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask
      - run: python -m py_compile beaconmatch_foundation.py scenario_rescue_engine.py wsgi.py
      - run: python -m unittest -v test_beaconmatch_foundation.py
