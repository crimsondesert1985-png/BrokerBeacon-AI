name: apply-full-website-review-fix
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply full website review fix
        run: |
          set -e
          git config user.email "crimsondesert1985@gmail.com"
          git config user.name "crimsondesert1985-png"
          python3 tools/apply_full_website_review_fix.py
          python3 -m py_compile BrokerBeacon_AI_Phase2/app.py
          wc -c BrokerBeacon_AI_Phase2/app.py
          grep -n "openSite\|_resolve_prospect_website\|return true" BrokerBeacon_AI_Phase2/app.py | head -12
          grep -q "_resolve_prospect_website" BrokerBeacon_AI_Phase2/app.py
          grep -q "return true" BrokerBeacon_AI_Phase2/app.py
          git add BrokerBeacon_AI_Phase2/app.py tools/apply_full_website_review_fix.py
          git commit -m "Fix Review company website: reliable open tab + full contact scrape/import" || echo "no changes"
          git push origin HEAD:main
