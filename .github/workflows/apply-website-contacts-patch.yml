name: apply-website-contacts-patch
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply website contacts Intelligence patch
        run: |
          git config user.email "crimsondesert1985@gmail.com"
          git config user.name "crimsondesert1985-png"
          python3 -c "import base64; from pathlib import Path; Path('tools').mkdir(exist_ok=True); Path('tools/apply_website_contacts_patch.py').write_bytes(base64.b64decode('$(cat /tmp/b64_placeholder)'))"
