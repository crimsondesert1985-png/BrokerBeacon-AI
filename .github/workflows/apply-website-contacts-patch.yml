name: apply-website-contacts-patch
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write and apply website contacts patch
        run: |
          mkdir -p tools
          python3 - <<'PY'
          from pathlib import Path
          Path('tools/apply_website_contacts_patch.py').write_text(Path('/dev/stdin').read_text() if False else open(0).read() if False else '')
          PY
