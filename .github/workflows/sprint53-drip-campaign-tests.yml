name: Sprint 53 Drip Campaign Tests

on:
  pull_request:
    paths:
      - 'BrokerBeacon_AI_Phase2/drip_campaigns.py'
      - 'BrokerBeacon_AI_Phase2/help_layer.py'
      - 'BrokerBeacon_AI_Phase2/test_drip_campaigns.py'
      - 'BrokerBeacon_AI_Phase2/test_help_layer.py'
      - 'BrokerBeacon_AI_Phase2/wsgi.py'
      - '.github/workflows/sprint53-drip-campaign-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BrokerBeacon_AI_Phase2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask
      - run: python -m py_compile drip_campaigns.py help_layer.py wsgi.py
      - run: python -m unittest -v test_drip_campaigns.py test_help_layer.py
