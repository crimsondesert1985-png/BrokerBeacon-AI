name: Sprint 41-42 Queue, UX, and National Tests

on:
  pull_request:
    paths:
      - 'BrokerBeacon_AI_Phase2/ember_jobs.py'
      - 'BrokerBeacon_AI_Phase2/ember_worker.py'
      - 'BrokerBeacon_AI_Phase2/ember_hunt.py'
      - 'BrokerBeacon_AI_Phase2/national_scheduler.py'
      - 'BrokerBeacon_AI_Phase2/national_autopilot_api.py'
      - 'BrokerBeacon_AI_Phase2/sprint42_national_ux.py'
      - 'BrokerBeacon_AI_Phase2/wsgi.py'
      - 'BrokerBeacon_AI_Phase2/test_ember_jobs.py'
      - 'BrokerBeacon_AI_Phase2/test_ember_queue_migration.py'
      - 'BrokerBeacon_AI_Phase2/test_sprint41_ux.py'
      - 'BrokerBeacon_AI_Phase2/test_sprint41_drilldown_ux.py'
      - 'BrokerBeacon_AI_Phase2/test_national_scheduler.py'
      - '.github/workflows/sprint41-queue-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r BrokerBeacon_AI_Phase2/requirements.txt
      - name: Compile Sprint 41-42 modules
        run: python -m py_compile BrokerBeacon_AI_Phase2/ember_jobs.py BrokerBeacon_AI_Phase2/ember_worker.py BrokerBeacon_AI_Phase2/ember_hunt.py BrokerBeacon_AI_Phase2/national_scheduler.py BrokerBeacon_AI_Phase2/national_autopilot_api.py BrokerBeacon_AI_Phase2/sprint42_national_ux.py BrokerBeacon_AI_Phase2/wsgi.py
      - name: Run Sprint 41-42 tests
        working-directory: BrokerBeacon_AI_Phase2
        run: python -m unittest -v test_ember_jobs.py test_ember_queue_migration.py test_sprint41_ux.py test_sprint41_drilldown_ux.py test_national_scheduler.py
