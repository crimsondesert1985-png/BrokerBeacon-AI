name: restore-app-py-review-website
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild app.py from verified chunks (Ash voice + website review)
        run: |
          set -e
          git config user.email "crimsondesert1985@gmail.com"
          git config user.name "crimsondesert1985-png"
          python3 << 'PY'
          import base64
          from pathlib import Path
          chunks = sorted(Path("tools/restore_chunks").glob("part_*.b64"))
          assert chunks, "no chunks"
          b64 = "".join(p.read_text().strip() for p in chunks)
          data = base64.b64decode(b64)
          Path("BrokerBeacon_AI_Phase2/app.py").write_bytes(data)
          print("wrote", len(data), "bytes from", len(chunks), "chunks")
          PY
          python3 -m py_compile BrokerBeacon_AI_Phase2/app.py
          wc -c BrokerBeacon_AI_Phase2/app.py
          grep -n "toggleAshMic\|_resolve_prospect_website\|return true\|wants_contacts\|ashMic" BrokerBeacon_AI_Phase2/app.py | head -20
          grep -q "toggleAshMic" BrokerBeacon_AI_Phase2/app.py
          grep -q "_resolve_prospect_website\|openSite" BrokerBeacon_AI_Phase2/app.py
          git add BrokerBeacon_AI_Phase2/app.py tools/restore_chunks .github/workflows/restore-app-py-review-website.yml
          git status --short
          git commit -m "Ash Voice Assistant: talk-to-Ash mic + contact/draft intents + website review" || echo "no changes"
          git push origin HEAD:main
