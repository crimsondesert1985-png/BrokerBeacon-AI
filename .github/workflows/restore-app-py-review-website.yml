name: restore-app-py-review-website
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild app.py from base64 chunks and push
        run: |
          set -e
          git config user.email "crimsondesert1985@gmail.com"
          git config user.name "crimsondesert1985-png"
          python3 << 'EOF'
          from pathlib import Path
          import base64
          chunks = Path("tools/restore_chunks")
          names = [ln.strip() for ln in (chunks / "manifest.txt").read_text().splitlines() if ln.strip()]
          b64 = "".join((chunks / n).read_text().strip() for n in names)
          data = base64.b64decode(b64)
          out = Path("BrokerBeacon_AI_Phase2/app.py")
          out.write_bytes(data)
          print("restored", out.stat().st_size, "bytes")
          text = data.decode("utf-8")
          assert "def refresh_contacts" in text
          assert "openSite" in text
          assert "_resolve_prospect_website" in text
          EOF
          python3 -m py_compile BrokerBeacon_AI_Phase2/app.py
          git add BrokerBeacon_AI_Phase2/app.py
          git commit -m "Restore full app.py: Review company website opens tab + scrapes/imports contacts" || echo "no changes"
          git push origin HEAD:main
