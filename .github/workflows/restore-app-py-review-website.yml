name: restore-app-py-review-website
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore app.py from last known good commit
        run: |
          set -e
          git config user.email "crimsondesert1985@gmail.com"
          git config user.name "crimsondesert1985-png"
          # Prefer 35f310b (Restore + open tab + scrape) then fall back
          if git cat-file -e 35f310b:BrokerBeacon_AI_Phase2/app.py 2>/dev/null; then
            git show 35f310b:BrokerBeacon_AI_Phase2/app.py > BrokerBeacon_AI_Phase2/app.py
            echo "Restored from 35f310b"
          elif git cat-file -e 3d7cc72:BrokerBeacon_AI_Phase2/app.py 2>/dev/null; then
            git show 3d7cc72:BrokerBeacon_AI_Phase2/app.py > BrokerBeacon_AI_Phase2/app.py
            echo "Restored from 3d7cc72"
          else
            echo "No known good blob found"
            exit 1
          fi
          python3 -m py_compile BrokerBeacon_AI_Phase2/app.py
          wc -c BrokerBeacon_AI_Phase2/app.py
          grep -n "openSite\|refresh_contacts\|_resolve_prospect_website" BrokerBeacon_AI_Phase2/app.py | head -10
          git add BrokerBeacon_AI_Phase2/app.py
          git commit -m "Restore app.py from known-good commit (Review company website open+scrape)" || echo "no changes"
          git push origin HEAD:main
