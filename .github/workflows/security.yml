name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BrokerBeacon_AI_Phase2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: BrokerBeacon_AI_Phase2/requirements.txt
      - name: Install application and audit tools
        run: python -m pip install -r requirements.txt pip-audit
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Compile production modules
        run: python -m py_compile app.py saas.py data_durability.py security_monitoring.py
