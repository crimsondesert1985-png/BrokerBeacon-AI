services:
  - type: web
    name: brokerbeacon-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BROKERBEACON_DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
